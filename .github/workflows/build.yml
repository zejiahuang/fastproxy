name: Build & Deploy APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  Configuration: Release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36
            build-tools;36.0.0

      - name: Restore NuGet packages
        run: dotnet restore src/ST.Client.Android.App.Modern/ST.Client.Android.App.Modern.csproj

      - name: Build APK (SHADOWSOCKS default)
        run: |
          dotnet build src/ST.Client.Android.App.Modern/ST.Client.Android.App.Modern.csproj \
            -c Release \
            -tl:off \
            -m:1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: steampptools-apk
          path: |
            src/ST.Client.Android.App.Modern/bin/Release/net10.0-android/*-Signed.apk
            src/ST.Client.Android.App.Modern/bin/Release/net10.0-android/*-Signed.aab
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: steampptools-apk
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*-Signed.apk
            artifacts/*-Signed.aab
